services:
  # PostgreSQL 数据库
  postgres:
    image: registry.cn-shanghai.aliyuncs.com/bountyteam/postgres:16-alpine
    container_name: ai-share-postgres
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ai-share-network
    restart: unless-stopped

  # Redis 缓存
  redis:
    image: registry.cn-shanghai.aliyuncs.com/bountyteam/redis:7-alpine
    container_name: ai-share-redis
    environment:
      TZ: Asia/Shanghai
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ai-share-network
    restart: unless-stopped

  # MinIO 对象存储
  minio:
    image: registry.cn-shanghai.aliyuncs.com/bountyteam/minio
    container_name: ai-share-minio
    env_file:
      - .env
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      TZ: Asia/Shanghai
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ai-share-network
    restart: unless-stopped

  # MinIO 初始化
  minio-init:
    image: registry.cn-shanghai.aliyuncs.com/bountyteam/mc
    container_name: ai-share-minio-init
    env_file:
      - .env
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ./minio-policy.json:/tmp/policy.json:ro
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD};
      mc mb --ignore-existing myminio/ai-share;
      sed 's/\${bucket}/ai-share/g' /tmp/policy.json > /tmp/ai-share-policy.json;
      mc anonymous set-json /tmp/ai-share-policy.json myminio/ai-share;
      mc mb --ignore-existing myminio/ai-share-public;
      sed 's/\${bucket}/ai-share-public/g' /tmp/policy.json > /tmp/ai-share-public-policy.json;
      mc anonymous set-json /tmp/ai-share-public-policy.json myminio/ai-share-public;
      exit 0;
      "
    networks:
      - ai-share-network

  # Spring Boot 后端
  backend:
    image: registry.cn-shanghai.aliyuncs.com/bountyteam/ai-share-backend:latest
    container_name: ai-share-backend
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: docker
      TZ: Asia/Shanghai
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - ai-share-network
    restart: unless-stopped

  # Vue 前端
  frontend:
    image: registry.cn-shanghai.aliyuncs.com/bountyteam/ai-share-frontend:latest
    container_name: ai-share-frontend
    environment:
      TZ: Asia/Shanghai
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./ssl:/etc/nginx/ssl:ro
      - ./nginx.prod.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    networks:
      - ai-share-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  ai-share-network:
    driver: bridge